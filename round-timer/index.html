<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reveal Timer">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reveal Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Reveal Timer</h1>

<div class="setup" id="setup">
  <div class="setup-col">
  <div class="section-label">Surprise me with…</div>
  <div class="art-row" id="artRow"></div>
  <button class="collection-btn" type="button" id="collectionBtn">🎁 My Collection — <span id="collectionCount">0 of 0</span></button>
  <div class="divider"><div class="divider-line"></div><span>or</span><div class="divider-line"></div></div>
  <label class="upload-btn" for="imageInput" id="uploadLabel">Upload your own photo</label>
  <input type="file" accept="image/*" id="imageInput">
  </div>

  <div class="setup-col">
  <div class="preview-wrap" id="previewWrap">
    <canvas id="previewCanvas" width="90" height="90"></canvas>
    <div class="preview-label" id="previewLabel"></div>
  </div>

  <div class="section-label">Background</div>
  <div class="bg-rows">
    <div class="bg-row">
      <span class="bg-row-label">Dark</span>
      <div class="bg-swatch selected" data-bg="#111827" data-mask="17,24,39"  title="Charcoal" style="background:#111827;"></div>
      <div class="bg-swatch" data-bg="#4c0f2a" data-mask="76,15,42"   title="Wine"    style="background:#4c0f2a;"></div>
      <div class="bg-swatch" data-bg="#5c2a06" data-mask="92,42,6"    title="Rust"    style="background:#5c2a06;"></div>
      <div class="bg-swatch" data-bg="#15522c" data-mask="21,82,44"   title="Forest"  style="background:#15522c;"></div>
      <div class="bg-swatch" data-bg="#0e4a5a" data-mask="14,74,90"   title="Teal"    style="background:#0e4a5a;"></div>
      <div class="bg-swatch" data-bg="#2b1b63" data-mask="43,27,99"   title="Indigo"  style="background:#2b1b63;"></div>
    </div>
    <div class="bg-row">
      <span class="bg-row-label">Light</span>
      <div class="bg-swatch" data-bg="#ffedd5" data-mask="255,237,213" data-light="1" title="Sand"     style="background:#ffedd5;"></div>
      <div class="bg-swatch" data-bg="#f9a8d4" data-mask="249,168,212" data-light="1" title="Pink"     style="background:#f9a8d4;"></div>
      <div class="bg-swatch" data-bg="#e0f2fe" data-mask="224,242,254" data-light="1" title="Sky"      style="background:#e0f2fe;"></div>
      <div class="bg-swatch" data-bg="#bbf7d0" data-mask="187,247,208" data-light="1" title="Mint"     style="background:#bbf7d0;"></div>
      <div class="bg-swatch" data-bg="#c4b5fd" data-mask="196,181,253" data-light="1" title="Lavender" style="background:#c4b5fd;"></div>
      <div class="bg-swatch" data-bg="#fef08a" data-mask="254,240,138" data-light="1" title="Butter"   style="background:#fef08a;"></div>
    </div>
  </div>

  <div class="field">
    <div class="section-label">Duration</div>
    <select id="durationSelect">
      <option value="30">30 seconds</option>
      <option value="60">1 minute</option>
      <option value="120">2 minutes</option>
      <option value="300" selected>5 minutes</option>
      <option value="600">10 minutes</option>
      <option value="900">15 minutes</option>
    </select>
  </div>
  <div class="sound-row">
    <label class="toggle">
      <input type="checkbox" id="soundToggle" checked>
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
    <label for="soundToggle">Play sound when done</label>
  </div>
  <div class="start-bar"><button class="start-btn" id="startBtn" disabled>Pick a surprise first</button></div>
  </div>
</div>

<div class="timer-view" id="timerView">
  <div class="wake-banner" id="wakeBanner">
    ⚠️ Keep screen on &amp; unmute your device to hear the reveal chime.
    <button type="button" id="wakeBannerClose">✕</button>
  </div>
  <div class="time-display" id="timeDisplay">00:00</div>
  <canvas id="canvas" width="320" height="320"></canvas>
  <div class="reveal-name" id="revealName"></div>
  <div class="controls">
    <button class="ctrl-btn pause" id="pauseBtn">Pause</button>
    <button class="ctrl-btn reset" id="resetBtn">Reset</button>
  </div>
</div>

<div class="sheet" id="collectionSheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2>My Collection</h2>
      <button type="button" id="collectionClose" aria-label="Close">✕</button>
    </div>
    <div class="sheet-sub" id="collectionSub"></div>
    <div class="collection-grid" id="collectionGrid"></div>
    <div class="sheet-credit">Monkey and friends: <a href="https://openmoji.org/" target="_blank" rel="noopener">OpenMoji</a>, CC BY-SA 4.0</div>
    <div class="zoom-view" id="zoomView">
      <canvas id="zoomCanvas" width="250" height="250"></canvas>
      <h3 id="zoomName"></h3>
      <button class="zoom-start" type="button" id="zoomStart">▶ Start timer</button>
      <button class="zoom-select" type="button" id="zoomSelect">Select, don't start yet</button>
      <button class="zoom-back" type="button" id="zoomBack">← Back to all</button>
    </div>
  </div>
</div>

<!-- Plain scripts, in dependency order: modules need iOS 10.3 and don't load from file://. -->
<script src="art/helpers.js"></script>
<script src="art/patterns.js"></script>
<script src="art/openmoji.js"></script>
<script src="art/animals.js"></script>
<script src="art/food.js"></script>
<script src="art/words.js"></script>
<script src="art/tiles.js"></script>
<script src="catalog.js"></script>
<script src="app.js"></script>
<script>
  /* Only for opening without a network; everything works without it. */
  if ('serviceWorker' in navigator && /^http/.test(location.protocol)) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    });
  }
</script>
</body>
</html>
